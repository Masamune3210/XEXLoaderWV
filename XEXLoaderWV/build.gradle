// Builds a Ghidra Extension for a given Ghidra installation.
//
// An absolute path to the Ghidra installation directory must be supplied either by setting the 
// GHIDRA_INSTALL_DIR environment variable or Gradle project property:
//
//     > export GHIDRA_INSTALL_DIR=<Absolute path to Ghidra> 
//     > gradle
//
//         or
//
//     > gradle -PGHIDRA_INSTALL_DIR=<Absolute path to Ghidra>
//
// Gradle should be invoked from the directory of the project to build.  Please see the
// application.gradle.version property in <GHIDRA_INSTALL_DIR>/Ghidra/application.properties
// for the correction version of Gradle to use for the Ghidra installation you specify.

//----------------------START "DO NOT MODIFY" SECTION------------------------------
def ghidraInstallDir

if (System.env.GHIDRA_INSTALL_DIR) {
	ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
}
else if (project.hasProperty("GHIDRA_INSTALL_DIR")) {
	ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}

if (ghidraInstallDir) {
	apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"
}
else {
	throw new GradleException("GHIDRA_INSTALL_DIR is not defined!")
}
//----------------------END "DO NOT MODIFY" SECTION-------------------------------


/*
 * Compile the experimental Xenon SLEIGH language as part of extension builds.
 * Without this, Ghidra's extension ZIP can be built and installed successfully
 * even though its .slaspec has fatal grammar or p-code errors. Run the same
 * Ghidra version's real Sleigh compiler and fail *before* packaging.
 *
 * This compiles into data/languages/xenon_64_be.sla, which the extension
 * packager then includes. The working A2ALT processor remains untouched.
 */
// Xenon is based on 2005-era AltiVec. Modern Ghidra's altivec.sinc also
// defines POWER ISA 2.07 and 3.0 vector instructions, some of which reuse
// the same machine words as Xenon-specific VMX128 encodings. Including those
// later constructors causes silent wrong-mnemonic disassembly, not just
// undecoded opcodes. Generate a *variant-local* pre-2.07 copy from the exact
// installed Ghidra source; never edit Ghidra's own stock processor files.
def xenonStockAltivec = new File(ghidraInstallDir,
    "Ghidra/Processors/PowerPC/data/languages/altivec.sinc")
def xenonLegacyAltivec = file("data/languages/xenon_altivec_pre207.sinc")
tasks.register("prepareXenonLegacyAltivec") {
    group = "verification"
    description = "Remove POWER 2.07/3.0 opcode collisions from Xenon-only AltiVec include"
    inputs.file(xenonStockAltivec)
    outputs.file(xenonLegacyAltivec)
    doLast {
        String upstream = xenonStockAltivec.getText("UTF-8")
        String marker = "define pcodeop altv207_1;"
        int cutoff = upstream.indexOf(marker)
        if (cutoff < 0 || upstream.indexOf(marker, cutoff + marker.length()) >= 0 ||
                !upstream.substring(0, cutoff).contains(":vxor vrD") ||
                !upstream.substring(cutoff).contains("# 2.07 additions") ||
                !upstream.substring(cutoff).contains("# v3.0")) {
            throw new GradleException(
                "Installed Ghidra AltiVec source layout changed; refusing to " +
                "generate Xenon variant include from " + xenonStockAltivec)
        }
        String legacy = upstream.substring(0, cutoff)
        if (legacy.contains("altv207_") || legacy.contains("altv300_")) {
            throw new GradleException(
                "Unexpected newer ISA references in pre-2.07 AltiVec prefix")
        }
        // Replace stock opaque VSCR transfers only in this generated Xenon
        // variant, keeping stock Ghidra and non-Xenon languages untouched.
        int mfStart = legacy.indexOf(":mfvscr vrD")
        int mtStart = legacy.indexOf(":mtvscr vrB")
        int nextStart = legacy.indexOf(":stvebx vrS")
        if (mfStart < 0 || mtStart <= mfStart || nextStart <= mtStart ||
                legacy.indexOf(":mfvscr vrD", mfStart + 1) >= 0 ||
                legacy.indexOf(":mtvscr vrB", mtStart + 1) >= 0) {
            throw new GradleException("Unexpected stock VSCR transfer layout")
        }
        String oldTransfers = legacy.substring(mfStart, nextStart)
        if (!oldTransfers.contains("vrD = moveFromVectorStatusAndControlRegister();") ||
                !oldTransfers.contains("moveToVectorStatusAndControlRegister(vrB);") ||
                !oldTransfers.contains("XOP_1_10=770 & Rc=0") ||
                !oldTransfers.contains("XOP_1_10=802 & Rc=0")) {
            throw new GradleException("Refusing to patch unexpected AltiVec VSCR semantics")
        }
        String nativeTransfers = '''
:mfvscr vrD is OP=4 & vrD & vrAR=0 & vrBR=0 & XOP_1_10=770 & Rc=0
{
    vscrVector:16 = zext(xenonVSCR);
    vrD = vscrVector;
}

:mtvscr vrB is OP=4 & vrDR=0 & vrAR=0 & vrB & XOP_1_10=802 & Rc=0
{
    xenonVSCR = vrB(0);
}

'''
        legacy = legacy.substring(0, mfStart) + nativeTransfers +
            legacy.substring(nextStart)

        // Classic LVSL is still an opaque TODO in stock AltiVec. Besides
        // blocking emulation, it incorrectly treats RA=0 as physical r0.
        // Use the same byte-mask semantics as Xenon LVSL128.
        // RA=0 is a zero base, while RB=0 still reads the real r0 register.
        int lvslStart = legacy.indexOf(":lvsl vrD,A,B")
        int lvsrStart = legacy.indexOf(":lvsr vrD,RA_OR_ZERO,B")
        if (lvslStart < 0 || lvsrStart <= lvslStart ||
                legacy.indexOf(":lvsl vrD,A,B", lvslStart + 1) >= 0 ||
                !legacy.substring(lvslStart, lvsrStart).contains(
                    "vrD = loadVectorForShiftLeft(A,B);")) {
            throw new GradleException("Unexpected stock LVSL constructor layout")
        }
        String nativeLvsl = '''
:lvsl vrD,RA_OR_ZERO,B is OP=31 & vrD & RA_OR_ZERO & B & XOP_1_10=6 & Rc=0
{
    build RA_OR_ZERO;
    ea:$(REGISTER_SIZE) = RA_OR_ZERO + B;
    off:1 = ea[0,4];
    shift:1 = (16 - off) * 8;
    srca:32 = 0x0001020304050607;
    srcb:32 = 0x08090a0b0c0d0e0f;
    srcc:32 = 0x1011121314151617;
    srcd:32 = 0x18191a1b1c1d1e1f;
    src:32 = (srca << 192) | (srcb << 128) | (srcc << 64) | srcd;
    src = src >> shift;
    vrD = src:16;
}

'''
        // Keep the old pcodeop declaration so unrelated userop IDs stay stable.
        legacy = legacy.substring(0, lvslStart) + nativeLvsl.toString() +
            legacy.substring(lvsrStart)
        xenonLegacyAltivec.setText(
            "# Generated by prepareXenonLegacyAltivec; do not edit.\n" +
            "# Source: installed Ghidra altivec.sinc, before altv207_1.\n" +
            legacy, "UTF-8")
    }
}

// A2 / generic PPC ISA includes broad data-cache and external-PID vector
// constructors that conflict with Xenon's actual opcodes. Keep a narrowly
// altered copy in the variant ONLY. Fail closed if the installed source
// changes rather than rewriting an unrelated or newer ISA file.
def xenonStockIsa = new File(ghidraInstallDir,
    "Ghidra/Processors/PowerPC/data/languages/ppc_isa.sinc")
def xenonLegacyIsa = file("data/languages/xenon_ppc_isa.sinc")
tasks.register("prepareXenonIsa") {
    group = "verification"
    description = "Restrict generic PPC/A2 instructions that overlap Xenon opcodes"
    inputs.file(xenonStockIsa)
    outputs.file(xenonLegacyIsa)
    doLast {
        String src = xenonStockIsa.getText("UTF-8")
        String dcbzOld = ':dcbz A,B is $(NOTVLE) & OP=31 & A & B & XOP_1_10=1014'
        String dcbzNew = ':dcbz A,B is $(NOTVLE) & OP=31 & BITS_21_25=0 & A & B & XOP_1_10=1014'
        if (src.indexOf(dcbzOld) < 0 ||
                src.indexOf(dcbzOld) != src.lastIndexOf(dcbzOld) ||
                !src.contains("define pcodeop stvepxOp;") ||
                !src.contains("define pcodeop stvepxlOp;")) {
            throw new GradleException("Installed ppc_isa.sinc changed; cannot safely " +
                "generate Xenon-only collision-free ISA variant")
        }
        src = src.replace(dcbzOld, dcbzNew)
        // The copied ISA lives in our extension's data/languages directory.
        // Preserve the stock Ghidra-relative VSX include by anchoring it to
        // the installed PowerPC processor's source directory instead.
        String stockVsxInclude = '@include "vsx.sinc"'
        String resolvedVsxInclude = '@include "$(PowerPC)/data/languages/vsx.sinc"'
        if (src.indexOf(stockVsxInclude) < 0 ||
                src.indexOf(stockVsxInclude) != src.lastIndexOf(stockVsxInclude)) {
            throw new GradleException(
                "Unexpected vsx.sinc include layout in installed ppc_isa.sinc")
        }
        src = src.replace(stockVsxInclude, resolvedVsxInclude)
        for (String name : ["stvepx", "stvepxl"]) {
            String userop = "define pcodeop " + name + "Op;"
            String start = ":" + name + " S,RA_OR_ZERO,B is OP=31"
            int declaration = src.indexOf(userop)
            int constructor = src.indexOf(start, declaration)
            int end = src.indexOf("}", constructor)
            if (declaration < 0 || constructor < declaration ||
                    end < constructor || src.indexOf(userop, declaration + 1) >= 0 ||
                    src.indexOf(start, constructor + 1) >= 0) {
                throw new GradleException("Unexpected " + name +
                    " layout in installed PPC ISA source")
            }
            // Remove ONLY the exact A2 constructor and its unused pcodeop.
            src = src.substring(0, declaration) + src.substring(end + 1)
        }
        // Keep hardware hrfid side effects opaque, but model the control
        // transfer through architectural HSRR0 (SPR 314 / spr13a).
        // An opaque CALLOTHER without a RETURN makes Ghidra falsely infer
        // fallthrough into bytes that have a separate legitimate branch
        // predecessor in the Xbox 360 HV17559 image.
        // Verified against original 0x994: 4C000224, with private baseline
        // and patched SleighCompile/p-code tests (2026-10-22 v8, PASS).
        String hrfidOld = ':hrfid  is $(NOTVLE) & OP=19 & XOP_1_10=274  & BITS_11_25=0 & BIT_0=0  { hrfidOp(); }'
        String hrfidFixed = ':hrfid  is $(NOTVLE) & OP=19 & XOP_1_10=274  & BITS_11_25=0 & BIT_0=0  { hrfidOp(); return[spr13a]; }'
        if (src.indexOf(hrfidOld) < 0 ||
                src.indexOf(hrfidOld) != src.lastIndexOf(hrfidOld) ||
                src.contains(hrfidFixed)) {
            throw new GradleException("Installed PPC ISA hrfid layout changed; " +
                "refusing unverified Xenon flow substitution")
        }
        src = src.replace(hrfidOld, hrfidFixed)

        // Xenon implements the PowerPC Book III v2.02 tlbiel RB,L encoding:
        // bit 10 is an immediate large-page flag (L), not a register.
        // Newer ISA 3.0 reuses that field for RS/PID/RIC and Ghidra's
        // later-ISA constructors currently decode the real HV17559 word
        // 0x7C201A24 as "tlbiel r3,r1,0,0,0", hiding L=1.
        // Remove ONLY the three ISA 3.0 tlbiel forms in our generated
        // Xenon variant; leave the inherited v2.02 L=0 form in the
        // generated xenon_ppc_instructions.sinc and add an explicit L=1.
        String newerTlbielPrefix = ':tlbiel RB_OR_ZERO,RS_OR_ZERO,'
        def laterTlbielSelectors = [
            'BITS_16_20=0 & XOP_1_10=274',
            'BITS_18_19=2 & BIT_17 & BIT_16 & XOP_1_10=274',
            '(BITS_18_19=0 | BITS_18_19=1) & BIT_18 & BIT_17 & BIT_16=1 & XOP_1_10=274'
        ]
        for (String selector : laterTlbielSelectors) {
            int at = src.indexOf(newerTlbielPrefix)
            int end = at < 0 ? -1 : src.indexOf("\n}", at)
            String body = end < 0 ? "" : src.substring(at, end + 2)
            if (at < 0 || end <= at ||
                    !body.contains('OP=31 & RS_OR_ZERO & RB_OR_ZERO') ||
                    !body.contains(selector) ||
                    !body.contains('TLBInvalidateEntryLocal(RB_OR_ZERO,RS_OR_ZERO,') ||
                    body.indexOf('}') != body.lastIndexOf('}')) {
                throw new GradleException("Unexpected Power ISA 3.0 tlbiel " +
                    "layout: refusing unsafe Xenon-only legacy decoder change")
            }
            src = src.substring(0, at) + src.substring(end + 2)
        }
        if (src.contains(newerTlbielPrefix)) {
            throw new GradleException("Unexpected extra ISA 3.0 tlbiel constructor")
        }
        String xenonLegacyTlbielL1 =
            ':tlbiel RB_OR_ZERO,"1" is $(NOTVLE) & OP=31 & ' +
            'BITS_21_25=1 & BITS_16_20=0 & RB_OR_ZERO & ' +
            'XOP_1_10=274 & BIT_0=0 { TLBInvalidateEntryLocal(RB_OR_ZERO,1:1); }'
        if (src.contains(xenonLegacyTlbielL1)) {
            throw new GradleException("Duplicate Xenon tlbiel L=1 constructor")
        }
        src += '\n# Xenon PowerPC 2.02: bit 10 L=1 selects large-page local TLB invalidation.\n' +
            xenonLegacyTlbielL1 + '\n'
        if (!src.contains(dcbzNew) || src.contains("define pcodeop stvepxOp;") ||
                src.contains("define pcodeop stvepxlOp;")) {
            throw new GradleException("Xenon ISA collision filtering failed")
        }
        // Ghidra's generic Power ISA OP=4 maddhd/maddhdu/maddld
        // constructors overlap valid Xenon vsldoi128 words. In particular,
        // its XOP_0_5=48 decodes 0x10221830 as scalar maddhd rather than
        // vsldoi128 with extended VA=xv34. The other two selectors overlap
        // valid destination-extension bits. Remove only these three
        // constructors in the Xenon-specific generated copy, not upstream.
        for (def spec : [
                [name: "maddhd",  xo: 48, result: "D = tmpp(8);"],
                [name: "maddhdu", xo: 49, result: "D = tmpp(8);"],
                [name: "maddld",  xo: 51, result: "D = tmpp:8;"]]) {
            String head = ":" + spec.name + " D,A,B,C"
            int start = src.indexOf(head)
            int end = start < 0 ? -1 : src.indexOf("\n}", start)
            String expectedSelector =
                'is $(NOTVLE) & OP=4 & D & A & B & C & XOP_0_5=' +
                spec.xo + ' {'
            String body = end < 0 ? "" : src.substring(start, end + 2)
            if (start < 0 || end <= start ||
                    src.indexOf(head, start + head.length()) >= 0 ||
                    !body.contains(expectedSelector) ||
                    !body.contains("tmpp:16 = (tmpa * tmpb) + tmpc;") ||
                    !body.contains(spec.result) ||
                    body.indexOf("}") != body.lastIndexOf("}")) {
                throw new GradleException("Installed Ghidra " + spec.name +
                    " layout changed; refusing unsafe Xenon ISA filtering")
            }
            src = src.substring(0, start) + src.substring(end + 2)
            if (src.contains(head)) {
                throw new GradleException("Failed to exclude " +
                    spec.name + " from Xenon-only ISA")
            }
        }
        xenonLegacyIsa.setText(
            "# Generated from installed Ghidra ppc_isa.sinc; do not edit.\n" +
            src, "UTF-8")
    }
}

// The stock ppc_common.sinc indirectly includes ppc_embedded.sinc, which
// defines dcbzl on the SAME opcode as Xenon's dcbz128 (RT=1, XO=1014).
// Copy only for this experimental variant; remove that colliding constructor
// without touching the original PowerPC / embedded processor definitions.
def xenonStockCommon = new File(ghidraInstallDir,
    "Ghidra/Processors/PowerPC/data/languages/ppc_common.sinc")
def xenonStockEmbedded = new File(ghidraInstallDir,
    "Ghidra/Processors/PowerPC/data/languages/ppc_embedded.sinc")
def xenonStockInstructions = new File(ghidraInstallDir,
    "Ghidra/Processors/PowerPC/data/languages/ppc_instructions.sinc")
def xenonCommon = file("data/languages/xenon_ppc_common.sinc")
def xenonEmbedded = file("data/languages/xenon_ppc_embedded.sinc")
def xenonInstructions = file("data/languages/xenon_ppc_instructions.sinc")
tasks.register("prepareXenonCommon") {
    group = "verification"
    description = "Isolate embedded dcbzl and restore Xenon lwarx reservation bookkeeping"
    inputs.files(xenonStockCommon, xenonStockEmbedded, xenonStockInstructions)
    outputs.files(xenonCommon, xenonEmbedded, xenonInstructions)
    doLast {
        String common = xenonStockCommon.getText("UTF-8")
        String instructionsInclude = '@include "ppc_instructions.sinc"'
        String embeddedInclude = '@include "ppc_embedded.sinc"'
        if (common.indexOf(instructionsInclude) < 0 ||
                common.indexOf(instructionsInclude) != common.lastIndexOf(instructionsInclude) ||
                common.indexOf(embeddedInclude) < 0 ||
                common.indexOf(embeddedInclude) != common.lastIndexOf(embeddedInclude)) {
            throw new GradleException(
                "Installed ppc_common.sinc includes changed; cannot isolate Xenon dcbzl")
        }
        common = common.replace(instructionsInclude,
            '@include "xenon_ppc_instructions.sinc"')
        common = common.replace(embeddedInclude,
            '@include "xenon_ppc_embedded.sinc"')

        // Stock Ghidra 12.1.3's stswi partial-register-store macro
        // ignores its byte count and always writes four bytes. Keep the
        // repair variant-local: use the high-order 1..3 bytes of the low
        // 32-bit GPR value, in big-endian memory order.
        String stockPartialStore = '''macro storeRegisterPartial(reg, ea, sa) {
@ifdef BIT_64
  tmp:8 = reg; # workaround
  *:4(ea) = tmp:4;
@else
  *:4(ea) = reg;
@endif
  ea = ea + 4;
}'''
        String xenonPartialStore = '''macro storeRegisterPartial(reg, ea, sa) {
@ifdef BIT_64
  local wholeGpr:8 = reg;
  local word:4 = wholeGpr:4;
@else
  local word:4 = reg;
@endif
  *:1(ea) = word(3);
  ea = ea + 1;
  if (sa == 1) goto <partialDone>;
  *:1(ea) = word(2);
  ea = ea + 1;
  if (sa == 2) goto <partialDone>;
  *:1(ea) = word(1);
  ea = ea + 1;
  <partialDone>
}'''
        if (common.indexOf(stockPartialStore) < 0 ||
                common.indexOf(stockPartialStore) !=
                    common.lastIndexOf(stockPartialStore) ||
                common.contains(xenonPartialStore)) {
            throw new GradleException(
                "Installed Ghidra partial string store macro changed; " +
                "refusing Xenon-specific stswi semantics patch")
        }
        common = common.replace(stockPartialStore, xenonPartialStore)

        // This experimental Xenon language fixes MSR[SF]=0 implicit CR0
        // comparisons. Do not truncate the stored GPR, alter XER.SO, or
        // silently patch Ghidra's stock processor. The task-private Xenon
        // SLEIGH build passed 8192 original-helper cases and 84 unit cases.
        // Guard the complete upstream macro so unexpected Ghidra changes fail.
        String stockCr0Flags = '''macro cr0flags(result ) {
	# the first three bits of CR are set by signed comparison of the
	# result to zero, and the fourth bit of CR is copied from the SO field
	# of the XER
	setCrBit(cr0, 0, (result s< 0)); # 0b100
	setCrBit(cr0, 1, (result s> 0)); # 0b010
	setCrBit(cr0, 2, (result == 0)); # 0b001
	setCrBit(cr0, 3, (xer_so & 1));
}'''
        String xenonCr0Flags = '''macro cr0flags(result ) {
	# Fixed Xenon SF=0: compare the low 32 result bits for implicit CR0.
	# Preserve the complete 64-bit GPR result and XER.SO.
	local crFullResult:$(REGISTER_SIZE) = zext(result);
	local crResult32:4 = crFullResult:4;
	# the first three bits of CR are set by signed comparison of the
	# result to zero, and the fourth bit of CR is copied from the SO field
	# of the XER
	setCrBit(cr0, 0, (crResult32 s< 0)); # 0b100
	setCrBit(cr0, 1, (crResult32 s> 0)); # 0b010
	setCrBit(cr0, 2, (crResult32 == 0)); # 0b001
	setCrBit(cr0, 3, (xer_so & 1));
}'''
        if (common.indexOf(stockCr0Flags) < 0 ||
                common.indexOf(stockCr0Flags) !=
                    common.lastIndexOf(stockCr0Flags) ||
                common.contains(xenonCr0Flags)) {
            throw new GradleException(
                "Installed PPC cr0flags macro changed; refusing Xenon SF=0 patch")
        }
        common = common.replace(stockCr0Flags, xenonCr0Flags)

        // A store-conditional is not a regular memory store: hardware may
        // reject a reservation even when its flag was previously set.
        // Model the atomic commit and success result as ONE opaque operation.
        // No unconditional STORE may escape into the decompiler's p-code.
        String stockAtomicUserop = 'define pcodeop storeWordConditionalIndexed;'
        String xenonAtomicUserop =
            'define pcodeop xenonAtomicStoreWordConditional;'
        if (common.indexOf(stockAtomicUserop) < 0 ||
                common.indexOf(stockAtomicUserop) !=
                    common.lastIndexOf(stockAtomicUserop) ||
                common.contains(xenonAtomicUserop)) {
            throw new GradleException(
                "Installed PPC conditional-store userop declarations changed")
        }
        common = common.replace(stockAtomicUserop,
            stockAtomicUserop + '\n' + xenonAtomicUserop)

        String stockDwordAtomicUserop =
            'define pcodeop storeDoubleWordConditionalIndexed;'
        String xenonDwordAtomicUserop =
            'define pcodeop xenonAtomicStoreDoubleWordConditional;'
        if (common.indexOf(stockDwordAtomicUserop) < 0 ||
                common.indexOf(stockDwordAtomicUserop) !=
                    common.lastIndexOf(stockDwordAtomicUserop) ||
                common.contains(xenonDwordAtomicUserop)) {
            throw new GradleException(
                "Installed PPC doubleword conditional-store userop declaration changed")
        }
        common = common.replace(stockDwordAtomicUserop,
            stockDwordAtomicUserop + '\n' + xenonDwordAtomicUserop)

        String embedded = xenonStockEmbedded.getText("UTF-8")
        String target = ':dcbzl RA_OR_ZERO,B'
        String dcbzlPattern = 'BITS_21_25=1 & B & XOP_1_10=1014 & BIT_0=0'
        String next = 'define pcodeop memoryBarrier;'
        int start = embedded.indexOf(target)
        int end = embedded.indexOf(next, start)
        int comment = embedded.lastIndexOf('#dcbzl ', start)
        if (start < 0 || end <= start || comment < 0 ||
                embedded.indexOf(target, start + 1) >= 0 ||
                !embedded.substring(start, end).contains(dcbzlPattern) ||
                !embedded.substring(start, end).contains(
                    'dataCacheBlockClearToZero(ea);') ||
                embedded.indexOf(next, end + next.length()) >= 0) {
            throw new GradleException(
                "Installed ppc_embedded.sinc dcbzl layout changed; refusing to filter")
        }
        embedded = embedded.substring(0, comment) + embedded.substring(end)
        if (embedded.contains(target) || embedded.contains('#dcbzl ')) {
            throw new GradleException("Xenon embedded dcbzl exclusion failed")
        }
        // Ghidra 12.1.3's legacy BIT_0=0 lwarx constructor takes
        // precedence over its generic ISA constructor but comments out
        // RESERVE writes. Actual xboxkrnl 17559 stwcx. loops depend on
        // that state. Preserve the legacy decoder and load exactly; turn
        // on the three already-established reservation assignments only
        // in the generated Xenon language, failing closed on source drift.
        String instructions = xenonStockInstructions.getText("UTF-8")
        // Keep the old L=0 instruction but expose the page-size bit to
        // the same userop as our new L=1 encoding. Exact source guard
        // prevents accidental Ghidra-upgrade rewrites.
        String legacyTlbielL0 =
            ':tlbiel RB_OR_ZERO is $(NOTVLE) & OP=31 & RB_OR_ZERO & BITS_21_25=0 & BITS_16_20=0 & XOP_1_10=274 & BIT_0=0 { \n' +
            '\tTLBInvalidateEntryLocal(RB_OR_ZERO);\n}'
        String xenonTlbielL0 = legacyTlbielL0.replace(
            'TLBInvalidateEntryLocal(RB_OR_ZERO);',
            'TLBInvalidateEntryLocal(RB_OR_ZERO,0:1);')
        if (instructions.indexOf(legacyTlbielL0) < 0 ||
                instructions.indexOf(legacyTlbielL0) !=
                    instructions.lastIndexOf(legacyTlbielL0) ||
                instructions.contains(xenonTlbielL0)) {
            throw new GradleException("Stock legacy tlbiel L=0 constructor changed")
        }
        instructions = instructions.replace(legacyTlbielL0,xenonTlbielL0)

        String lwarxHead = ':lwarx D,RA_OR_ZERO,B'
        int lwarxStart = instructions.indexOf(lwarxHead)
        int lwarxEnd = instructions.indexOf("\n}", lwarxStart)
        String oldReservation =
            '\t#RESERVE = 1;\n\t#RESERVE_ADDRSS:$(REGISTER_SIZE) = ea;'
        String newReservation =
            '\tRESERVE = 1;\n\tRESERVE_LENGTH = 4;\n\tRESERVE_ADDRESS = ea;'
        if (lwarxStart < 0 || lwarxEnd <= lwarxStart ||
                instructions.indexOf(lwarxHead,
                    lwarxStart + lwarxHead.length()) >= 0) {
            throw new GradleException(
                "Installed Ghidra lwarx layout changed; refusing Xenon reservation patch")
        }
        String lwarxBody = instructions.substring(lwarxStart, lwarxEnd + 2)
        if (!lwarxBody.contains('XOP_1_10=20 & BIT_0=0') ||
                !lwarxBody.contains('ea:$(REGISTER_SIZE) = RA_OR_ZERO+B;') ||
                !lwarxBody.contains(oldReservation) ||
                !lwarxBody.contains('D = zext(*:4(ea));') ||
                lwarxBody.indexOf(oldReservation) !=
                    lwarxBody.lastIndexOf(oldReservation)) {
            throw new GradleException(
                "Stock legacy lwarx semantics changed; not modifying Xenon variant")
        }
        instructions = instructions.substring(0, lwarxStart) +
            lwarxBody.replace(oldReservation, newReservation) +
            instructions.substring(lwarxEnd + 2)
        if (instructions.contains(oldReservation) ||
                !instructions.contains(newReservation)) {
            throw new GradleException("Xenon lwarx reservation patch failed")
        }

        // Xenon operates with the 32-bit record-condition mode of a
        // 64-bit-register PPC core. Stock ppc_instructions.sinc passes the
        // entire 64-bit destination to cr0flags for addic. / subic.;
        // at 0xFFFFFFFF + 1 that incorrectly makes CR0.GT rather than EQ.
        // Fix ONLY CR0 evaluation: the existing full-width arithmetic,
        // XER.CA calculation and destination storage remain unchanged.
        // This uses the least significant word of the GPR, not a
        // truncated assignment to the 64-bit register itself.
        // Check exact original constructor bodies below, instead of
        // rewriting every cr0flags(D) occurrence in the generic ISA.
        String ppcAddicHead = ':addic. D,A,SIMM'
        String ppcSubicHead = ':subic. D,A,tmp'
        int addicStart = instructions.indexOf(ppcAddicHead)
        int subicStart = instructions.indexOf(ppcSubicHead)
        if (addicStart < 0 || subicStart < 0 ||
                instructions.indexOf(ppcAddicHead,
                    addicStart + ppcAddicHead.length()) >= 0 ||
                instructions.indexOf(ppcSubicHead,
                    subicStart + ppcSubicHead.length()) >= 0) {
            throw new GradleException(
                "Installed addic./subic. constructors missing or duplicated")
        }
        String addicBody = instructions.substring(
            addicStart, instructions.indexOf("\n}", addicStart) + 2)
        String subicBody = instructions.substring(
            subicStart, instructions.indexOf("\n}", subicStart) + 2)
        String addicOriginalBody = '''{
\txer_ca = carry(A,SIMM);
\tD = A + SIMM;
\tcr0flags( D );
}'''
        String subicOriginalBody = '''{
\txer_ca=carry(A,SIMM);
\tD = A + SIMM;
\tcr0flags( D );
}'''
        if (!addicBody.contains('OP=13') ||
                !addicBody.contains('SIMM_SIGN=0') ||
                !addicBody.endsWith(addicOriginalBody) ||
                !subicBody.contains('OP=13') ||
                !subicBody.contains('SIMM_SIGN=1') ||
                !subicBody.endsWith(subicOriginalBody) ||
                addicBody.indexOf(addicOriginalBody) !=
                    addicBody.lastIndexOf(addicOriginalBody) ||
                subicBody.indexOf(subicOriginalBody) !=
                    subicBody.lastIndexOf(subicOriginalBody)) {
            throw new GradleException(
                "Installed PPC addic./subic. record constructor changed; " +
                "refusing to alter Xenon CR0 semantics")
        }
        String newRecordBody = 'cr0flags( D:4 );'
        instructions = instructions.replace(addicBody,
            addicBody.replace('cr0flags( D );', newRecordBody))
        instructions = instructions.replace(subicBody,
            subicBody.replace('cr0flags( D );', newRecordBody))
        if (!instructions.contains('cr0flags( D:4 );') ||
                instructions.contains(addicBody) ||
                instructions.contains(subicBody)) {
            throw new GradleException(
                "Xenon 32-bit addic./subic. CR0 patch failed")
        }

        // The inherited stwcx. incorrectly writes an opaque value
        // unconditionally after checking RESERVE and sets CR0.EQ=1.
        // If RESERVE=0 it skips updating CR0 altogether. Replace only
        // this verified exact constructor in the Xenon-specific copy.
        // The new userop combines *atomic* memory side effect and boolean
        // completion status; all contention behavior stays unresolved.
        String stockStwcx = ''':stwcx. S,RA_OR_ZERO,B 	is OP=31 & S & RA_OR_ZERO & B & XOP_1_10=150 & BIT_0=1
{
	EA:$(REGISTER_SIZE) = RA_OR_ZERO + B;
	if (RESERVE == 0) goto inst_next;
	*[ram]:4 EA = storeWordConditionalIndexed(S,RA_OR_ZERO,B);
	# set when a stwcx. or stdcx. successfully completes
	cr0flags(0:$(REGISTER_SIZE));
}'''
        String xenonStwcx = ''':stwcx. S,RA_OR_ZERO,B 	is OP=31 & S & RA_OR_ZERO & B & XOP_1_10=150 & BIT_0=1
{
    EA:$(REGISTER_SIZE) = RA_OR_ZERO + B;
    local succeeded:1 = 0;
    if (RESERVE == 0) goto <finishStoreConditional>;
    # This opaque userop represents the ATOMIC commit and reports
    # hardware success. It must not be replaced by a plain STORE:
    # another processor may invalidate the reservation at any time.
    succeeded = xenonAtomicStoreWordConditional(EA, S:4, RESERVE_ADDRESS, RESERVE_LENGTH);
    <finishStoreConditional>
    RESERVE = 0;
    RESERVE_LENGTH = 0;
    setCrBit(cr0, 0, 0);
    setCrBit(cr0, 1, 0);
    setCrBit(cr0, 2, succeeded);
    setCrBit(cr0, 3, (xer_so & 1));
}'''
        if (instructions.indexOf(stockStwcx) < 0 ||
                instructions.indexOf(stockStwcx) !=
                    instructions.lastIndexOf(stockStwcx) ||
                instructions.contains(xenonStwcx)) {
            throw new GradleException(
                "Installed Ghidra stwcx. constructor changed; refusing " +
                "Xenon conditional-store semantics replacement")
        }
        instructions = instructions.replace(stockStwcx, xenonStwcx)


        // The installed stdcx. has the same unconditional-store,
        // stale-CR0, and lost-failure problems as stwcx. Keep the
        // doubleword transaction opaque, with an explicit success bit.
        String stockStdcx = ''':stdcx. S,RA_OR_ZERO,B 	is OP=31 & S & RA_OR_ZERO & B & XOP_1_10=214 & BIT_0=1
{
	EA:$(REGISTER_SIZE) = RA_OR_ZERO + B;
	if (RESERVE == 0) goto inst_next;
	*[ram]:8 EA = storeDoubleWordConditionalIndexed(S,RA_OR_ZERO,B);
	# set when a stwcx. or stdcx. successfully completes
	cr0flags(0:$(REGISTER_SIZE));
}'''
        String xenonStdcx = ''':stdcx. S,RA_OR_ZERO,B 	is OP=31 & S & RA_OR_ZERO & B & XOP_1_10=214 & BIT_0=1
{
    EA:$(REGISTER_SIZE) = RA_OR_ZERO + B;
    local succeeded:1 = 0;
    if (RESERVE == 0) goto <finishDoubleWordConditional>;
    # The single opaque userop owns the atomic memory side effect.
    succeeded = xenonAtomicStoreDoubleWordConditional(EA, S, RESERVE_ADDRESS, RESERVE_LENGTH);
    <finishDoubleWordConditional>
    RESERVE = 0;
    RESERVE_LENGTH = 0;
    setCrBit(cr0, 0, 0);
    setCrBit(cr0, 1, 0);
    setCrBit(cr0, 2, succeeded);
    setCrBit(cr0, 3, (xer_so & 1));
}'''
        if (instructions.indexOf(stockStdcx) < 0 ||
                instructions.indexOf(stockStdcx) !=
                    instructions.lastIndexOf(stockStdcx) ||
                instructions.contains(xenonStdcx)) {
            throw new GradleException(
                "Installed Ghidra stdcx. constructor changed; refusing " +
                "Xenon conditional-store semantics replacement")
        }
        instructions = instructions.replace(stockStdcx, xenonStdcx)

        // ppc_instructions.sinc is copied into the extension, so its five
        // stock-relative instruction helper includes no longer resolve.
        // Anchor every helper to the installed, version-matched PowerPC
        // sources using the existing -dPowerPC SLEIGH define. Never copy
        // or modify those Ghidra-owned helper files.
        for (String helper : [
                "lmwInstructions.sinc", "lswInstructions.sinc",
                "mulhwInstructions.sinc", "stmwInstructions.sinc",
                "stswiInstructions.sinc"]) {
            File stockHelper = new File(xenonStockInstructions.parentFile, helper)
            String relativeInclude = '@include "' + helper + '"'
            String resolvedInclude =
                '@include "$(PowerPC)/data/languages/' + helper + '"'
            if (!stockHelper.isFile() ||
                    instructions.indexOf(relativeInclude) < 0 ||
                    instructions.indexOf(relativeInclude) !=
                        instructions.lastIndexOf(relativeInclude)) {
                throw new GradleException(
                    "Installed Ghidra PPC instruction include changed: " + helper)
            }
            instructions = instructions.replace(relativeInclude, resolvedInclude)
        }
        xenonCommon.setText(
            "# Generated from installed Ghidra ppc_common.sinc; do not edit.\n" +
            common, "UTF-8")
        xenonEmbedded.setText(
            "# Generated from installed Ghidra ppc_embedded.sinc; do not edit.\n" +
            embedded, "UTF-8")
        xenonInstructions.setText(
            "# Generated from installed Ghidra ppc_instructions.sinc; do not edit.\n" +
            instructions, "UTF-8")
    }
}

// Keep the Ghidra fixture and its classification manifest synchronized with
// BOTH SLEIGH includes whenever the extension is built. This is deliberately
// always run: generation is cheap, and an up-to-date Gradle stamp is not proof
// that a manually replaced manifest is still current.
tasks.register("generateXenonIsaFixture", Exec) {
    group = "verification"
    description = "Regenerate the 344-word Xenon ISA fixture and source coverage manifest"
    workingDir projectDir
    def onWindows = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")
    def pythonCommand = project.findProperty("XENON_PYTHON")?.toString() ?:
        (onWindows ? "python" : "python3")
    commandLine pythonCommand, "tools/audit_xenon_isa_coverage_v1.py"
    inputs.files(
        file("tools/audit_xenon_isa_coverage_v1.py"),
        file("tools/data/xenia_vmx128_opcode_inventory_20261009.tsv"),
        file("tools/data/xenia_xform_vector_opcode_inventory_20261009.tsv"),
        file("tools/data/xenon_vmx128_unpack_corrections_20261010.tsv"),
        file("data/languages/xenon_vector_v1.sinc"),
        file("data/languages/xenon_vector_remaining_v1.sinc"),
        file("data/languages/xenon_64_be.slaspec"))
    // Intentionally no output cache/up-to-date declaration: always regenerate.
}

// Gate every extension build on the offline Python regression suite as
// well as the real SLEIGH compiler. The Python tests inspect the recorded
// ISA families, generated fixtures, p-code source invariants, and the
// checked-in unified Ghidra numerical audit. Missing test dependencies
// are build failures, rather than silently omitted checks.
tasks.register("testXenonIsaCoverage", Exec) {
    group = "verification"
    description = "Run complete offline Xenon ISA regression suite"
    dependsOn tasks.named("generateXenonIsaFixture")
    workingDir projectDir
    def onWindows = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")
    def pythonCommand = project.findProperty("XENON_PYTHON")?.toString() ?:
        (onWindows ? "python" : "python3")
    commandLine pythonCommand, "tools/test_xenon_isa_coverage_v1.py"
    // Deliberately run each build: tests validate external source files,
    // not just one generated artifact's timestamp.
}

tasks.register("testXenonCr0Mode", Exec) {
    group = "verification"
    description = "Check generated Xenon SF=0 CR0 semantics and witness vectors"
    dependsOn tasks.named("prepareXenonCommon")
    workingDir projectDir
    def onWindows = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")
    def pythonCommand = project.findProperty("XENON_PYTHON")?.toString() ?:
        (onWindows ? "python" : "python3")
    commandLine pythonCommand, "tools/test_xenon_cr0_mode_v1.py"
}

// Ensure linked-XEX signature propagation guards remain intact for every build.
// The Ghidra compiler/runtime API is validated separately by compiling the extension.
tasks.register("testXenonLegacyTlbiel", Exec) {
    group = "verification"
    description = "Guard original Xenon 2.02 tlbiel RB,L, including HV17559 L=1"
    dependsOn tasks.named("prepareXenonIsa"), tasks.named("prepareXenonCommon")
    workingDir projectDir
    def onWindows = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")
    def pythonCommand = project.findProperty("XENON_PYTHON")?.toString() ?:
        (onWindows ? "python" : "python3")
    commandLine pythonCommand, "tools/test_xenon_tlbiel_legacy_v1.py"
}

tasks.register("testXenonHrfidFlow", Exec) {
    group = "verification"
    description = "Guard Xenon-specific hrfid return flow via 64-bit HSRR0"
    dependsOn tasks.named("prepareXenonIsa"), tasks.named("prepareXenonCommon")
    workingDir projectDir
    def onWindows = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")
    def pythonCommand = project.findProperty("XENON_PYTHON")?.toString() ?:
        (onWindows ? "python" : "python3")
    commandLine pythonCommand, "tools/test_xenon_hrfid_flow_v1.py"
}

tasks.register("testXexLinkedImports", Exec) {
    group = "verification"
    description = "Check linked import signature sync refuses opaque or edited contracts"
    workingDir projectDir
    def onWindows = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")
    def pythonCommand = project.findProperty("XENON_PYTHON")?.toString() ?:
        (onWindows ? "python" : "python3")
    commandLine pythonCommand, "tools/test_xex_linked_import_signature_analyzer_v1.py"
}

tasks.register("verifyXenonSleigh", Exec) {
    dependsOn tasks.named("generateXenonIsaFixture"), tasks.named("testXenonIsaCoverage"), tasks.named("testXenonCr0Mode"), tasks.named("testXenonHrfidFlow"), tasks.named("testXenonLegacyTlbiel"), tasks.named("testXexLinkedImports")
    dependsOn tasks.named("prepareXenonLegacyAltivec"), tasks.named("prepareXenonIsa"), tasks.named("prepareXenonCommon")
    group = "verification"
    description = "Compile Xenon SLEIGH with the installed Ghidra compiler before extension packaging"
    workingDir file("data")
    def windows = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")
    def compiler = new File(ghidraInstallDir, windows ? "support/sleigh.bat" : "support/sleigh")
    if (!compiler.isFile()) {
        throw new GradleException("Ghidra Sleigh compiler launch script not found: " + compiler)
    }
    commandLine compiler.absolutePath, "-i", "sleighArgs.txt",
        "languages/xenon_64_be.slaspec", "languages/xenon_64_be.sla"
    inputs.files(fileTree("data/languages") { include("*.sinc", "*.slaspec") })
    inputs.file(file("data/sleighArgs.txt"))
    outputs.file(file("data/languages/xenon_64_be.sla"))
}
// Opt-in diagnostic compile. Keep the packaged .sla untouched and enumerate
// constructor-level warnings using Ghidra's own -n, -u and -t reports.
// No warning is suppressed, and diagnostics aren't required for normal builds.
tasks.register("diagnoseXenonSleigh", Exec) {
    dependsOn tasks.named("generateXenonIsaFixture")
    dependsOn tasks.named("prepareXenonLegacyAltivec"),
              tasks.named("prepareXenonIsa"), tasks.named("prepareXenonCommon")
    group = "verification"
    description = "List Xenon SLEIGH NOP constructors, redundant casts, and unused temporaries"
    workingDir file("data")
    def windows = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")
    def compiler = new File(ghidraInstallDir, windows ? "support/sleigh.bat" : "support/sleigh")
    if (!compiler.isFile()) {
        throw new GradleException("Ghidra Sleigh compiler launch script not found: " + compiler)
    }
    commandLine compiler.absolutePath, "-n", "-u", "-t", "-i", "sleighArgs.txt",
        "languages/xenon_64_be.slaspec",
        "../build/xenon-isa-audit/xenon_64_be_diagnostics.sla"
    inputs.files(fileTree("data/languages") { include("*.sinc", "*.slaspec") })
    inputs.file(file("data/sleighArgs.txt"))
    // Separate destination avoids confusing the real extension build stamp.
    outputs.file(file("build/xenon-isa-audit/xenon_64_be_diagnostics.sla"))
}

// Attach to standard Ghidra extension build entrypoints if present, without
// relying on one particular support/buildExtension.gradle task name.
tasks.matching { it.name in ["build", "buildExtension", "assemble"] }.configureEach {
    dependsOn tasks.named("verifyXenonSleigh")
}
