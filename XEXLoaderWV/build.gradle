// Builds a Ghidra Extension for a given Ghidra installation.
//
// An absolute path to the Ghidra installation directory must be supplied either by setting the 
// GHIDRA_INSTALL_DIR environment variable or Gradle project property:
//
//     > export GHIDRA_INSTALL_DIR=<Absolute path to Ghidra> 
//     > gradle
//
//         or
//
//     > gradle -PGHIDRA_INSTALL_DIR=<Absolute path to Ghidra>
//
// Gradle should be invoked from the directory of the project to build.  Please see the
// application.gradle.version property in <GHIDRA_INSTALL_DIR>/Ghidra/application.properties
// for the correction version of Gradle to use for the Ghidra installation you specify.

//----------------------START "DO NOT MODIFY" SECTION------------------------------
def ghidraInstallDir

if (System.env.GHIDRA_INSTALL_DIR) {
	ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
}
else if (project.hasProperty("GHIDRA_INSTALL_DIR")) {
	ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}

if (ghidraInstallDir) {
	apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"
}
else {
	throw new GradleException("GHIDRA_INSTALL_DIR is not defined!")
}
//----------------------END "DO NOT MODIFY" SECTION-------------------------------


/*
 * Compile the experimental Xenon SLEIGH language as part of extension builds.
 * Without this, Ghidra's extension ZIP can be built and installed successfully
 * even though its .slaspec has fatal grammar or p-code errors. Run the same
 * Ghidra version's real Sleigh compiler and fail *before* packaging.
 *
 * This compiles into data/languages/xenon_64_be.sla, which the extension
 * packager then includes. The working A2ALT processor remains untouched.
 */
// Xenon is based on 2005-era AltiVec. Modern Ghidra's altivec.sinc also
// defines POWER ISA 2.07 and 3.0 vector instructions, some of which reuse
// the same machine words as Xenon-specific VMX128 encodings. Including those
// later constructors causes silent wrong-mnemonic disassembly, not just
// undecoded opcodes. Generate a *variant-local* pre-2.07 copy from the exact
// installed Ghidra source; never edit Ghidra's own stock processor files.
def xenonStockAltivec = new File(ghidraInstallDir,
    "Ghidra/Processors/PowerPC/data/languages/altivec.sinc")
def xenonLegacyAltivec = file("data/languages/xenon_altivec_pre207.sinc")
tasks.register("prepareXenonLegacyAltivec") {
    group = "verification"
    description = "Remove POWER 2.07/3.0 opcode collisions from Xenon-only AltiVec include"
    inputs.file(xenonStockAltivec)
    outputs.file(xenonLegacyAltivec)
    doLast {
        String upstream = xenonStockAltivec.getText("UTF-8")
        String marker = "define pcodeop altv207_1;"
        int cutoff = upstream.indexOf(marker)
        if (cutoff < 0 || upstream.indexOf(marker, cutoff + marker.length()) >= 0 ||
                !upstream.substring(0, cutoff).contains(":vxor vrD") ||
                !upstream.substring(cutoff).contains("# 2.07 additions") ||
                !upstream.substring(cutoff).contains("# v3.0")) {
            throw new GradleException(
                "Installed Ghidra AltiVec source layout changed; refusing to " +
                "generate Xenon variant include from " + xenonStockAltivec)
        }
        String legacy = upstream.substring(0, cutoff)
        if (legacy.contains("altv207_") || legacy.contains("altv300_")) {
            throw new GradleException(
                "Unexpected newer ISA references in pre-2.07 AltiVec prefix")
        }
        xenonLegacyAltivec.setText(
            "# Generated by prepareXenonLegacyAltivec; do not edit.\n" +
            "# Source: installed Ghidra altivec.sinc, before altv207_1.\n" +
            legacy, "UTF-8")
    }
}

// A2 / generic PPC ISA includes broad data-cache and external-PID vector
// constructors that conflict with Xenon's actual opcodes. Keep a narrowly
// altered copy in the variant ONLY. Fail closed if the installed source
// changes rather than rewriting an unrelated or newer ISA file.
def xenonStockIsa = new File(ghidraInstallDir,
    "Ghidra/Processors/PowerPC/data/languages/ppc_isa.sinc")
def xenonLegacyIsa = file("data/languages/xenon_ppc_isa.sinc")
tasks.register("prepareXenonIsa") {
    group = "verification"
    description = "Restrict generic PPC/A2 instructions that overlap Xenon opcodes"
    inputs.file(xenonStockIsa)
    outputs.file(xenonLegacyIsa)
    doLast {
        String src = xenonStockIsa.getText("UTF-8")
        String dcbzOld = ":dcbz A,B is $(NOTVLE) & OP=31 & A & B & XOP_1_10=1014"
        String dcbzNew = ":dcbz A,B is $(NOTVLE) & OP=31 & BITS_21_25=0 & A & B & XOP_1_10=1014"
        if (src.indexOf(dcbzOld) < 0 ||
                src.indexOf(dcbzOld) != src.lastIndexOf(dcbzOld) ||
                !src.contains("define pcodeop stvepxOp;") ||
                !src.contains("define pcodeop stvepxlOp;")) {
            throw new GradleException("Installed ppc_isa.sinc changed; cannot safely " +
                "generate Xenon-only collision-free ISA variant")
        }
        src = src.replace(dcbzOld, dcbzNew)
        for (String name : ["stvepx", "stvepxl"]) {
            String userop = "define pcodeop " + name + "Op;"
            String start = ":" + name + " S,RA_OR_ZERO,B is OP=31"
            int declaration = src.indexOf(userop)
            int constructor = src.indexOf(start, declaration)
            int end = src.indexOf("}", constructor)
            if (declaration < 0 || constructor < declaration ||
                    end < constructor || src.indexOf(userop, declaration + 1) >= 0 ||
                    src.indexOf(start, constructor + 1) >= 0) {
                throw new GradleException("Unexpected " + name +
                    " layout in installed PPC ISA source")
            }
            // Remove ONLY the exact A2 constructor and its unused pcodeop.
            src = src.substring(0, declaration) + src.substring(end + 1)
        }
        if (!src.contains(dcbzNew) || src.contains("define pcodeop stvepxOp;") ||
                src.contains("define pcodeop stvepxlOp;")) {
            throw new GradleException("Xenon ISA collision filtering failed")
        }
        xenonLegacyIsa.setText(
            "# Generated from installed Ghidra ppc_isa.sinc; do not edit.\\n" +
            src, "UTF-8")
    }
}

tasks.register("verifyXenonSleigh", Exec) {
    dependsOn tasks.named("prepareXenonLegacyAltivec"), tasks.named("prepareXenonIsa")
    group = "verification"
    description = "Compile Xenon SLEIGH with the installed Ghidra compiler before extension packaging"
    workingDir file("data")
    def windows = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")
    def compiler = new File(ghidraInstallDir, windows ? "support/sleigh.bat" : "support/sleigh")
    if (!compiler.isFile()) {
        throw new GradleException("Ghidra Sleigh compiler launch script not found: " + compiler)
    }
    commandLine compiler.absolutePath, "-i", "sleighArgs.txt",
        "languages/xenon_64_be.slaspec", "languages/xenon_64_be.sla"
    inputs.files(fileTree("data/languages") { include("*.sinc", "*.slaspec") })
    inputs.file(file("data/sleighArgs.txt"))
    outputs.file(file("data/languages/xenon_64_be.sla"))
}
// Attach to standard Ghidra extension build entrypoints if present, without
// relying on one particular support/buildExtension.gradle task name.
tasks.matching { it.name in ["build", "buildExtension", "assemble"] }.configureEach {
    dependsOn tasks.named("verifyXenonSleigh")
}
